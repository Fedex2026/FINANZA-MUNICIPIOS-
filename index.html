<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Control de Ingresos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="styles.css" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="theme-color" content="#07111f">
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="topbar">
    <button class="iconBtn" onclick="abrirMenu()">☰</button>

    <div class="logoHeader">
      <img src="logo.png">
      <div>
        <h1>Control de Ingresos</h1>
        <p>Grúas Metropolitanas</p>
      </div>
    </div>

    <button class="iconBtn" onclick="irA('registros')">⌕</button>
  </header>

  <!-- MENU -->
  <div id="menuLateral" class="menuLateral">
    <button onclick="cerrarMenu()">✕ Cerrar</button>
    <button onclick="irA('inicio')">Inicio</button>
    <button onclick="irA('agregar')">Agregar</button>
    <button onclick="irA('resumen')">Resumen</button>
    <button onclick="irA('registros')">Registros</button>
    <button onclick="enviarWhatsApp('dia')">🟢 WhatsApp Día</button>
    <button onclick="enviarWhatsApp('semana')">🟢 WhatsApp Semana</button>
  </div>

  <!-- FORM -->
  <section class="panel agregarPanel">

    <label>Fecha</label>
    <input type="date" id="fecha" />

    <label>Marca</label>
    <input type="text" id="marca" />

    <label>Submarca</label>
    <input type="text" id="submarca" />

  </section>

  <!-- TIPO -->
  <section class="panel">
    <div class="sectionTitle">TIPO DE PAGO</div>

    <div class="payButtons">
      <button id="btnEfectivo" onclick="setTipo('efectivo')">EFECTIVO</button>
      <button id="btnVale" onclick="setTipo('vale')">VALE</button>
      <button id="btnTransferencia" onclick="setTipo('transferencia')">TRANSFERENCIA</button>
    </div>

    <input type="hidden" id="tipo" />
  </section>

  <!-- VALES -->
  <section class="panel" id="valePanel">
    <label>Aseguradora</label>
    <select id="aseguradora">
      <option value="">Seleccionar</option>
      <option>CHUBB</option>
      <option>ATLAS</option>
      <option>AXA</option>
      <option>SURA</option>
      <option>GNP</option>
    </select>
  </section>

  <!-- INGRESO -->
  <section class="panel">
    <label id="labelMonto">Monto recibido</label>
    <input type="number" id="monto" />
  </section>

  <!-- GUARDAR -->
  <button class="saveBtn" onclick="guardar()">GUARDAR</button>

  <!-- REGISTROS -->
  <section class="panel registrosPanel">
    <div id="lista"></div>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
